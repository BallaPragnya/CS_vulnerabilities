<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory – CampusConnect</title>
  <meta name="description" content="Browse the full student directory on CampusConnect." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="layout">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-breadcrumb">CampusConnect / <span>Directory</span></div>
        </div>
        <div class="topbar-right">
          <a href="/search.html" class="btn btn-sm btn-outline">🔍 Search Students</a>
        </div>
      </header>

      <div class="page-inner">

        <div class="page-header fade-in">
          <h1>📋 Student Directory</h1>
          <p>Browse all enrolled students. <span id="student-count" class="text-muted"></span></p>
        </div>

        <div class="card fade-in">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Department</th>
                  <th style="text-align:center;">Year</th>
                  <th style="text-align:center;">GPA</th>
                </tr>
              </thead>
              <tbody id="dir-tbody">
                <tr><td colspan="6" class="text-center text-muted">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/directory.js"></script>
</body>
</html>
