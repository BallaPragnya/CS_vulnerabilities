<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – CampusConnect</title>
  <meta name="description" content="Sign in to CampusConnect, the university student portal." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Login page has no sidebar – it's a standalone centred card -->
  <div class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="logo-mark">🎓</div>
        <div>
          <div class="logo-name">CampusConnect</div>
          <div class="logo-tagline">University Student Portal</div>
        </div>
      </div>

      <h2>Sign In</h2>
      <p class="subtitle">Enter your credentials to access the portal.</p>

      <!-- Alert box (shown on login error or success) -->
      <div id="alert-box" class="alert" role="alert"></div>

      <!-- Login form -->
      <form id="login-form" novalidate>

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="e.g. admin"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg mt-md">
          <span id="btn-spinner" style="display:none;">⏳</span>
          <span id="btn-text">Sign In</span>
        </button>

      </form>

      <!-- Sample credentials hint for the lab -->
      <hr class="divider" />
      <p class="text-center text-xs text-dim">
        Lab credentials: <code>admin/admin123</code> · <code>teacher/teacher123</code> · <code>alice/alice123</code>
      </p>

    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
